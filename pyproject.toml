[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofix-agent"
version = "0.2.0"
description = "Autonomous codebase self-healing agent built with LangGraph and Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-google-genai",
    "python-dotenv",
    "colorama",
]

[project.scripts]
autofix = "autofix.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
